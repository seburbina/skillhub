name: deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Deploys the Cloudflare Worker (apps/api) on every push to main. Dev
# deploys automatically; prod deploys require the `production` env's
# required-reviewer gate to be satisfied (configure in GitHub → Settings
# → Environments → production → Required reviewers).
#
# Required secrets (set in repo Settings → Secrets):
#   CLOUDFLARE_API_TOKEN   — Workers deploy permission
#   CLOUDFLARE_ACCOUNT_ID  — your account id
#
# Secrets that the Worker needs at runtime (DATABASE_URL, ADMIN_TOKEN,
# VOYAGE_API_KEY if used, etc.) are managed via `wrangler secret put`
# and are NOT touched by this workflow — existing secrets persist
# across deploys.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which env to deploy"
        required: true
        default: "dev"
        type: choice
        options: [dev, production]

jobs:
  deploy-dev:
    if: github.event_name == 'push' || github.event.inputs.target == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        # Version comes from package.json `packageManager` field.
        # Passing `version:` here conflicts with that since pnpm/action-setup@v4.
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Pre-flight — fail if dev worker claims brand custom domains
        # Wrangler.toml's `routes = []` in [env.dev] PREVENTS new attachments
        # but does NOT detach existing custom domains — they have to be
        # removed via the Cloudflare dashboard. If a previous deploy or a
        # manual click attached the brand domains to skillhub-dev, traffic
        # to agentskilldepot.com silently routes to dev (different DB,
        # different secrets) and the install flow breaks.
        # Guard the deploy by failing fast with a clear remediation message.
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rogue=$(curl -sf -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/domains?service=skillhub-dev" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          rogue = [r.get('hostname','') for r in d.get('result', [])
                   if r.get('hostname','').endswith('agentskilldepot.com')]
          print('\n'.join(rogue))
          " || true)
          if [ -n "$rogue" ]; then
            echo "::error::skillhub-dev has these brand domains attached — they belong on the prod skillhub worker:"
            echo "$rogue" | sed 's/^/  - /'
            echo ""
            echo "Remove them via Cloudflare dashboard:"
            echo "  Workers & Pages → skillhub-dev → Settings → Domains & Routes → X each row"
            echo "Then re-run: cd apps/api && ./node_modules/.bin/wrangler deploy"
            echo "(restores them to the prod skillhub worker via the top-level [[routes]] in wrangler.toml)"
            exit 1
          fi
          echo "OK: skillhub-dev does not claim agentskilldepot.com domains"

      - name: Deploy to dev
        run: pnpm exec wrangler deploy --env=dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Notify on failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create ci-failure --color FF0000 --description "Auto-filed CI failure" || true
          gh issue create \
            --repo ${{ github.repository }} \
            --title "deploy ${{ github.job }} failed: ${{ github.sha }}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.event_name }} on ${{ github.ref }}" \
            --label "ci-failure" || true

  deploy-prod:
    # Prod deploys only on explicit workflow_dispatch → target=production,
    # with the `production` environment required-reviewer gate in front.
    # Auto-deploy on main push is intentionally dev-only so that prod
    # rollouts stay a human decision.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        # Version comes from package.json `packageManager` field.
        # Passing `version:` here conflicts with that since pnpm/action-setup@v4.
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Deploy to production
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Notify on failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create ci-failure --color FF0000 --description "Auto-filed CI failure" || true
          gh issue create \
            --repo ${{ github.repository }} \
            --title "deploy ${{ github.job }} failed: ${{ github.sha }}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.event_name }} on ${{ github.ref }}" \
            --label "ci-failure" || true
