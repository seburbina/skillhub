name: skill-trigger-eval

# Catches the regression mode where a SKILL.md description rewrite
# silently breaks intent matching. Runs weekly so a slow drift in
# Claude's classifier behavior is also surfaced — and on-demand via
# workflow_dispatch when you want to gate a specific PR before merge.

on:
  schedule:
    - cron: "0 9 * * 1"  # Monday 09:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run eval
        env:
          # Workers AI (Llama 3.3 70B) — Anthropic-neutral oracle so the
          # eval proves the SKILL.md description is routable by an open
          # model, which is a better proxy for cross-vendor compatibility
          # than testing against Claude specifically.
          # Reuses the same secrets already provisioned for deploy.yml.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Uses vitest.eval.config.ts which includes `*.eval.ts` (the
        # default vitest.config.ts deliberately excludes them to keep
        # `pnpm test` fast).
        run: pnpm exec vitest run --config vitest.eval.config.ts --reporter=verbose
