name: Publish base-skill release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Builds the skillhub base skill as a .skill archive on every tagged
# release, and attaches it as a release asset. Users install from here.

on:
  push:
    tags:
      - "base-skill-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package skillhub.skill (3-SKILL bundle via build_bundle.py)
        run: |
          # T-008: the release artifact bundles 3 sibling SKILLs (skillhub +
          # skillhub-identity + skillhub-publish). build_bundle.py walks
          # base-skill/<dir>/ for every dir with a SKILL.md and zips them
          # side-by-side. No skill-creator stub needed at release time —
          # the quality gate runs in the user's session when they publish
          # someone-else's skill, not here.
          mkdir -p dist
          python3 base-skill/build_bundle.py dist/skillhub.skill
          sha256sum dist/skillhub.skill > dist/skillhub.skill.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/skillhub.skill
            dist/skillhub.skill.sha256
          generate_release_notes: true
